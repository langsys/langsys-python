[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langsys"
version = "0.1.0"
description = "Official Python SDK for Langsys — realtime, continuous translations. The phrase in your code is the lookup key and the base-language default (no keys file, no extraction step)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Langsys" }]
keywords = ["langsys", "i18n", "internationalization", "localization", "translation", "icu", "cldr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Localization",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "babel>=2.12",
    "langcodes>=3.3",
]

[project.urls]
Homepage = "https://langsys.dev"
Documentation = "https://docs.langsys.dev"
Repository = "https://github.com/langsys/langsys-python"
Issues = "https://github.com/langsys/langsys-python/issues"

[project.optional-dependencies]
redis = ["redis>=4.0"]
html = ["lxml>=4.9", "cssselect>=1.2"]
dev = [
    "pytest>=7.4",
    "pytest-httpx>=0.30",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-babel",
    "lxml>=4.9",
    "cssselect>=1.2",
    "lxml-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langsys"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# UP (pyupgrade) is intentionally omitted: it rewrites runtime type aliases in ways that
# aren't safe on the 3.9 runtime we support.
select = ["E", "F", "I", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["redis.*", "babel.*", "langcodes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: talks to a live nova backend (deselect with -m 'not integration')",
]
