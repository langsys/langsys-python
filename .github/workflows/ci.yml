name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: mypy src

      # Unit tests only. Contract tests need an SDK test clone (README, "Contract tests") and
      # integration tests a live nova; both are run where those exist.
      - run: pytest -m "not integration and not contract"
